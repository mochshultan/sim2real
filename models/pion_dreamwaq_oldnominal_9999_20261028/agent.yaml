seed: 42
device: cuda:0
num_steps_per_env: 48
max_iterations: 1000
empirical_normalization: {}
obs_groups:
  actor:
  - policy
  critic:
  - critic
clip_actions: null
check_for_nan: true
save_interval: 100
experiment_name: pion_qr1_dreamwaq
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: DreamWaQRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.0
    std_type: scalar
  stochastic: {}
  init_noise_std: {}
  noise_std_type: scalar
  state_dependent_std: false
critic:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg: null
  stochastic: {}
  init_noise_std: {}
  noise_std_type: scalar
  state_dependent_std: false
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.005
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg: null
policy: {}
entropy_adaptive: true
entropy_coef_initial: 0.01
entropy_coef_final: 0.001
entropy_success_ema_alpha: 0.01
entropy_success_metric: Metrics/success_rate
reset_action_std_on_resume: false
resume_action_std: 1.0
history_len: 5
latent_dim: 16
vae_beta_coef: 0.001
enable_l2c2: false
l2c2_lambda_min: 0.01
l2c2_lambda_max: 1.0
l2c2_sigma: 1.0
l2c2_beta: 0.1
input_summary_entry_point: isaaclab_tasks.manager_based.locomotion.velocity.config.pion_qr1_dreamwaq.input_summary:build_input_summary
