seed: 42
device: cuda:0
num_steps_per_env: 48
init_at_random_ep_len: true
max_iterations: 6200
obs_groups:
  actor:
  - policy
  - base_lin_vel_target
  critic:
  - critic
clip_actions: 10.0
check_for_nan: true
save_interval: 100
experiment_name: pion_qr1_adaboot_l2c2_zero_32v_height25
run_name: from5300-h25-w10-std1-to11500-20261113-1152env
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: /home/shultan/IsaacLab/logs/queues/pion_zero_32v/from5300-h25-w10-std1-to11500-20261113/resume_next_iteration.pt
class_name: OnPolicyRunner
actor:
  class_name: isaaclab_tasks.core.velocity.config.nxp_jaguar_baseline_tibia_adaboot.velocity_estimator:VelocityEstimatorActor
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.0
    std_type: scalar
    std_range: !!python/tuple
    - 1.0e-06
    - 1000000.0
critic:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg: null
algorithm:
  class_name: isaaclab_tasks.core.velocity.config.nxp_jaguar_baseline_tibia_adaboot_ideal_l2c2.l2c2_adaboot_ppo:IdealAdaBootL2C2PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  use_mixed_precision: false
  rnd_cfg: null
  symmetry_cfg: null
  estimator_loss_coef: 1.0
  l2c2_lambda_min: 0.01
  l2c2_lambda_max: 1.0
  l2c2_sigma: 1.0
  l2c2_beta: 0.1
torch_compile_mode: null
entropy_adaptive: true
entropy_coef_initial: 0.01
entropy_coef_final: 0.001
entropy_success_ema_alpha: 0.01
entropy_success_metric: Metrics/success_rate
reset_action_std_on_resume: true
resume_action_std: 1.0
