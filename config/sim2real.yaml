# NXP Jaguar Quadruped - sim2real Unified ROS 2 Parameters Configuration
# Joint Order:
#   Coxa / Collar (Roll) : FR(9), FL(6), BR(3), BL(0)
#   Hip (Pitch)          : FR(10), FL(7), BR(4), BL(1)
#   Knee (Pitch)         : FR(11), FL(8), BR(5), BL(2)

joy_node:
  ros__parameters:
    dev: "/dev/input/js0"
    deadzone: 0.10
    autorepeat_rate: 50.0

robstride_can_hardware:
  ros__parameters:
    rate_hz: 200
    rt_priority: 80
    default_coxa_kp: 40.0
    default_coxa_kd: 2.5
    default_kp: 40.0
    default_kd: 2.5
    default_knee_kp: 40.0
    default_knee_kd: 2.5

jaguar_can_hardware:
  ros__parameters:
    rate_hz: 200
    default_coxa_kp: 40.0
    default_coxa_kd: 2.5
    default_kp: 40.0
    default_kd: 2.5
    default_knee_kp: 40.0
    default_knee_kd: 2.5

nxp_jaguar_controller:
  ros__parameters:
    # Low-level control is clamped at 13.5 Nm; this is the feedback watchdog.
    overtorque_threshold: 15.0
    shutdown_duration: 3.0
    shutdown_settle_delay: 0.5
    safe_park_duration: 2.0
    safe_park_kp: 14.0
    safe_park_kd: 0.5
    safe_park_double_press_window: 1.0
    cmd_timeout: 0.25
    action_ema_alpha: 0.0  # Disabled per user request (no EMA filter, direct policy actions)
    walk_ramp_duration: 0.8  # Soft-start cosine S-curve duration (s) when transitioning from STAND_HOLD to WALK
    imu_upside_down: true   # Set true if IMU is mounted rotated 180 deg around X on chassis
    rl_kp_roll: 40.0
    rl_kd_roll: 2.5
    rl_kp_pitch: 40.0
    rl_kd_pitch: 2.5
    rl_kp_knee: 40.0
    rl_kd_knee: 2.5
    transition_kp_roll: 40.0
    transition_kd_roll: 2.5
    transition_kp_pitch: 40.0
    transition_kd_pitch: 2.5
    transition_kp_knee: 40.0
    transition_kd_knee: 2.5
    # Standing auto-level is active only during STANDUP/STAND_HOLD.
    # Pitch correction is bounded at the hips; knees keep their nominal target.
    use_imu_stabilization: true
    imu_kp_pitch: 0.55
    imu_kd_pitch: 0.04
    imu_kp_roll: 0.30
    imu_kd_roll: 0.03
    imu_hip_tolerance: 0.15
    imu_roll_tolerance: 0.12
    imu_tilt_deadband: 0.02
