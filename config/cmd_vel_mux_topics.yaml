# The launch file names the node `jaguar_cmd_vel_mux`.  ROS 2 only applies
# parameters when the YAML root matches the node name (or is a wildcard).
jaguar_cmd_vel_mux:
  ros__parameters:
    topics:
      xbox:
        topic: /cmd_vel/xbox
        timeout: 0.30
        priority: 100
      keyboard:
        topic: /cmd_vel/keyboard
        timeout: 0.30
        priority: 10
