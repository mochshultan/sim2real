# NXP Jaguar RL Controller Configuration
nxp_jaguar_controller:
  ros__parameters:
    # Normal MIT torque is clamped in low-level software and firmware at
    # 13.5 Nm. Sustained feedback above this separate threshold requests
    # SAFE_PARK; a repeated fault during parking escalates to hard E-stop.
    overtorque_threshold: 15.0
    shutdown_duration: 3.0
    shutdown_settle_delay: 0.5
    safe_park_duration: 2.0
    safe_park_kp: 14.0
    safe_park_kd: 0.5
    safe_park_double_press_window: 1.0
    cmd_timeout: 0.25
    action_ema_alpha: 0.0  # 0.0 = disabled (previously 0.55)
    rl_kp_roll: 28.0
    rl_kd_roll: 0.7
    rl_kp_pitch: 28.0
    rl_kd_pitch: 0.7
    rl_kp_knee: 28.0
    rl_kd_knee: 0.7
    transition_kp_roll: 28.0
    transition_kd_roll: 1.2
    transition_kp_pitch: 28.0
    transition_kd_pitch: 1.2
    transition_kp_knee: 28.0
    transition_kd_knee: 1.2
