# NXP Jaguar RL Controller Configuration
nxp_jaguar_controller:
  ros__parameters:
    torque_limit: 14.0
    shutdown_duration: 3.0
    shutdown_settle_delay: 0.5
    cmd_timeout: 0.25
    joy_deadzone: 0.20
    action_ema_alpha: 0.0  # 0.0 = disabled (previously 0.55)
    rl_kp_roll: 28.0
    rl_kd_roll: 0.7
    rl_kp_pitch: 28.0
    rl_kd_pitch: 0.7
    transition_kp_roll: 28.0
    transition_kd_roll: 1.2
    transition_kp_pitch: 28.0
    transition_kd_pitch: 1.2
